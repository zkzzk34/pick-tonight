# The hand-written objects from warehouse/snowflake/02_staging.sql and
# 03_marts.sql. dbt does not build these. They are declared only so the
# parity tests can compare them with the dbt models that replace them.
# Remove this file and tests/parity/ once the old scripts are retired.

sources:
  - name: legacy_staging
    description: Original STAGING views, kept during the move to dbt.
    schema: STAGING
    tables:
      - name: stg_titles
      - name: stg_title_genres
      - name: stg_genres
      - name: stg_mood_rules
      - name: stg_events

  - name: legacy_marts
    description: Original MARTS tables. The AI and governance scripts still read these.
    schema: MARTS
    tables:
      - name: dim_title
      - name: bridge_title_genre
      - name: title_rule_moods
      - name: fct_events
      - name: fct_recommendation_journeys
      - name: agg_picker_funnel_daily
      - name: agg_mood_outcomes
