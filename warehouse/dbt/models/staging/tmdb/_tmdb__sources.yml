# TMDB catalog extracts, loaded into RAW by warehouse/snowflake/01_load_raw.sql.
# Each load is a full snapshot refresh, and every row keeps its lineage:
# the stage file it came from, its line number, and when it was loaded.

sources:
  - name: tmdb
    description: >
      TMDB catalog snapshots written by warehouse/extract/export-tmdb-catalog.ts,
      which reuses the app's own TMDB client and normalization.
    schema: RAW
    config:
      # Freshness compares loaded_at with now. A stale catalog warns after a
      # week and fails after a month, which is the reminder to re-export.
      loaded_at_field: loaded_at
      freshness:
        warn_after: {count: 7, period: day}
        error_after: {count: 30, period: day}
    tables:
      - name: tmdb_titles
        description: One normalized movie or TV title per row, stored as VARIANT with lineage fields.
      - name: tmdb_genres
        description: TMDB genre reference data, one row per genre and media type.
