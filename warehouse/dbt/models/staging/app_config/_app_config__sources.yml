# The app's rule-based mood mapping (src/server/mood-mapping.ts), exported as
# data so the warehouse can test the rules against the catalog.

sources:
  - name: app_config
    description: Configuration exported from PickTonight's own code by export-tmdb-catalog.ts.
    schema: RAW
    config:
      loaded_at_field: loaded_at
      freshness:
        warn_after: {count: 7, period: day}
        error_after: {count: 30, period: day}
    tables:
      - name: mood_genre_rules
        description: One row per mood signal. Genre signals list the media types they apply to.
