name: Browser compatibility Playwright

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  browser-compatibility:
    name: Chromium, Firefox, and WebKit compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.16.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install supported Playwright browsers and system dependencies
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Record tested browser versions
        run: npm run test:e2e:versions

      - name: Run critical and compatibility Playwright coverage
        run: npm run test:e2e

      - name: Upload failure-only Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
